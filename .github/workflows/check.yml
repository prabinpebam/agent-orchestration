name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: The installer works on an empty project, for every agent layout
        run: |
          mkdir -p "$RUNNER_TEMP/project"
          node tools/install.mjs "$RUNNER_TEMP/project" --for copilot,claude,agents
          test -f "$RUNNER_TEMP/project/.github/skills/orchestrate/SKILL.md"
          test -f "$RUNNER_TEMP/project/.github/agents/throughput-reviewer.agent.md"
          test -f "$RUNNER_TEMP/project/.claude/agents/throughput-reviewer.md"
          test -f "$RUNNER_TEMP/project/.agents/skills/orchestrate/SKILL.md"
          grep -q "agent-orchestration:start" "$RUNNER_TEMP/project/AGENTS.md"
